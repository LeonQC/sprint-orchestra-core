name: CI

# Runs on every push and PR — the guardrail that would have caught a real backfill_jira_backend.py
# bug before it ever touched real data: that bug had a real regression test written for it, but
# nothing ran that test automatically until now.
on:
  push:
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    # Same postgres:poc/poc123/pocdb shape as the jira-backend job below — without this service,
    # tests/test_rollout_graph.py's and tests/test_sprint_recovery_graph.py's real AsyncPostgresSaver
    # crash-resume tests (the proof of the durable-execution/idempotency claims, not just an
    # assertion) `pytest.importorskip`/connect-and-skip instead of running — this
    # service is what turns those from "developer has Postgres running locally" into an actual CI gate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc123
          POSTGRES_DB: pocdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d pocdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis-stack:
        image: redis/redis-stack-server:7.4.0-v3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # RediSearch indexes are supported only on database 0.
      TEST_REDIS_STACK_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  # The AI eval gate's CI half: the 12 Sprint Recovery scenarios and the prompt-injection probe call a
  # real model but use fake retrieval and Jira, so they need only an API key (~$0.05 a run). RAGAS
  # needs the whole stack and runs locally: scripts/run_rag_eval.sh gate. PRs and master only, so
  # work-in-progress pushes don't pay for model calls.
  ai-evals:
    runs-on: ubuntu-latest
    needs: ai-service
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: ai-service
    env:
      AI_OPENAI_BASE_URL: https://api.openai.com/v1
      AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_AGENT_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt
      - id: key
        run: |
          if [ -z "$AI_OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY secret not set; AI evals skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.skip != 'true'
        run: pip install -r requirements.txt
      # The probe exits 1 when an attack succeeds; the gate below reports it with everything else.
      - if: steps.key.outputs.skip != 'true'
        run: python -m eval.sprint_recovery_injection_probe --out injection.json || true
      - if: steps.key.outputs.skip != 'true'
        run: python -m eval.sprint_recovery_scenarios_eval --out scenarios.json
      - if: steps.key.outputs.skip != 'true'
        run: python -m eval.eval_gate --scenarios scenarios.json --injection injection.json

  vectorization-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee
        env:
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc123
          POSTGRES_DB: pocdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d pocdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: vectorization-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: vectorization-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  jira-backend:
    runs-on: ubuntu-latest
    # Matches jira-backend/src/main/resources/application.yml's hardcoded datasource credentials
    # exactly (same poc/poc123/pocdb this project's own local docker-compose already uses), so no
    # override/profile is needed — Flyway migrates this empty container on app startup like any other
    # fresh environment.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc123
          POSTGRES_DB: pocdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d pocdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Sessions (GitHub login state) live in Redis; GithubLoginSessionIT checks that.
      redis-stack:
        image: redis/redis-stack-server:7.4.0-v3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew :jira-backend:test --no-daemon

  # Packaging is not covered by the test jobs: `bootJar` once broke on a Gradle upgrade while every
  # test still passed. Building the real images catches that before a deploy does.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f jira-backend/Dockerfile -t sprint-orchestra/jira-backend .
      - run: docker build -t sprint-orchestra/postgres:15-pgvector docker/postgres
      - run: docker build -t sprint-orchestra/vectorization-service vectorization-service
      - run: docker build -t sprint-orchestra/ai-service ai-service
